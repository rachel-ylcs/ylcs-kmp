name: ReleaseDesktop

on:
  push:
    tags:
      - 'desktop*'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package-desktop:
    name: Package JVM Desktop Artifact
    uses: ./.github/workflows/desktop-build.yml
    with:
      task: :ylcs-app:desktop-app:desktopArtifact
      artifact-name: ylcs-{0}
      artifact-path: outputs/ylcs-{0}.zip
