name: ReleaseModManager

on:
  push:
    tags:
      - 'modManager*'
  workflow_call:

permissions:
  contents: read

jobs:
  package-mod-manager:
    name: Package Mod Manager / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x64
            target: windows
            task-target: Windows
            konan-target: mingw_x64
            workers: 2
          - runner: ubuntu-24.04
            platform: linux-x64
            target: linux
            task-target: Linux
            konan-target: linux_x64
            workers: 2
          - runner: macos-26
            platform: macos-arm64
            target: macos
            task-target: Macos
            konan-target: macos_arm64
            workers: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          msvc: ${{ runner.os == 'Windows' }}
          native-tools: 'true'

      - name: Build Native Release Distribution
        run: >-
          bash ./gradlew :ylcs-app:mod-manager:package${{ matrix.task-target }}ReleaseExecutable
          --no-daemon --build-cache --max-workers=${{ matrix.workers }} --console=plain

      - name: Upload Application
        uses: actions/upload-artifact@v7
        with:
          name: ylcs-mod-manager-${{ matrix.platform }}
          path: ylcs-app/mod-manager/build/distributions/ModManager-${{ matrix.konan-target }}-release.zip
          if-no-files-found: error

      - name: Upload Release Symbols
        uses: actions/upload-artifact@v7
        with:
          name: mod-manager-symbols-${{ matrix.platform }}
          path: |
            ylcs-app/mod-manager/build/nativeSymbols/${{ matrix.target }}/releaseExecutable/
            ylcs-app/mod-manager/build/nativeSymbols/${{ matrix.target }}/releaseExecutable-distribution.properties
          if-no-files-found: error
