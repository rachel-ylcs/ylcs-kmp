name: ReleaseModManager

on:
  push:
    tags:
      - 'modManager*'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: workflow-release_mod_manager
  cancel-in-progress: true

jobs:
  package-mod-manager:
    name: Package Mod Manager Artifact
    uses: ./.github/workflows/desktop-build.yml
    with:
      task: :ylcs-app:mod-manager:modManagerArtifact
      native: true
      submodules: 'false'
      artifact-name: ylcs-mod-manager-{0}
      artifact-path: outputs/ylcs-mod-manager-{0}.zip
