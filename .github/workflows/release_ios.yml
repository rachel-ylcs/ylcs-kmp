name: ReleaseIOS
on:
  push:
    tags:
      - 'ios*'
jobs:
  package-ios:
    name: Package iOS
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build

      - name: Build
        id: package
        uses: ./.github/actions/package-ios
        with:
          ipa-name: "[iOS]银临茶舍${{ github.ref_name }}.ipa"
