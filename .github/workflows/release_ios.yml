name: ReleaseIOS
on:
  push:
    tags:
      - 'ios*'
concurrency:
  group: workflow-release_ios
  cancel-in-progress: true

jobs:
  package-ios:
    name: Package iOS
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build

      - name: Build
        id: package
        uses: ./.github/actions/package-ios
        with:
          ipa-name: ylcs-ios.ipa

      - name: Upload Application
        uses: actions/upload-artifact@v7
        with:
          name: ylcs-ios
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
