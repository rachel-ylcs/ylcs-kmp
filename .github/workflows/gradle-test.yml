name: Gradle Test

on:
  workflow_call:
    inputs:
      runner:
        description: Runner used to execute the Gradle task.
        type: string
        default: ubuntu-latest
      task:
        description: An aggregate test task in ylcs-module:build-tool.
        type: string
        required: true
      android:
        description: Install Android SDK packages.
        type: boolean
        default: false
      msvc:
        description: Configure the MSVC toolchain on Windows.
        type: boolean
        default: false
      gtk:
        description: Install GTK development dependencies on Linux.
        type: boolean
        default: false
      web:
        description: Run browser tests with a virtual display on Linux.
        type: boolean
        default: false

jobs:
  test:
    name: Gradle
    runs-on: ${{ inputs.runner }}
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: ${{ startsWith(inputs.runner, 'windows-') && 'pwsh' || 'bash' }}
    steps:
      - name: Setup Build Environment
        uses: $/.github/actions/setup-build
        with:
          submodules: recursive
          android: ${{ inputs.android }}
          msvc: ${{ inputs.msvc }}
          gtk: ${{ inputs.gtk }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Test (Windows)
        id: windows-tests
        if: ${{ !inputs.web && runner.os == 'Windows' }}
        shell: pwsh
        env:
          GRADLE_TASK: ylcs-module:build-tool:${{ inputs.task }}
          TEST_LOG: build/test-report/gradle-${{ inputs.task }}.log
        run: |
          New-Item -ItemType Directory -Force build/test-report | Out-Null
          ./gradlew "$env:GRADLE_TASK" --continue --console=plain --stacktrace 2>&1 | Tee-Object -FilePath $env:TEST_LOG
          exit $LASTEXITCODE

      - name: Test
        id: unix-tests
        if: ${{ !inputs.web && runner.os != 'Windows' }}
        shell: bash
        env:
          GRADLE_TASK: ylcs-module:build-tool:${{ inputs.task }}
          TEST_LOG: build/test-report/gradle-${{ inputs.task }}.log
        run: |
          mkdir -p build/test-report
          set -o pipefail
          ./gradlew "$GRADLE_TASK" --continue --console=plain --stacktrace 2>&1 | tee "$TEST_LOG"

      - name: Test in Chrome
        id: browser-tests
        if: ${{ inputs.web }}
        shell: bash
        env:
          GRADLE_TASK: ylcs-module:build-tool:${{ inputs.task }}
          TEST_LOG: build/test-report/gradle-${{ inputs.task }}.log
        # Some modules use headed Chrome; Xvfb also supports those tests in CI.
        run: |
          mkdir -p build/test-report
          set -o pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          xvfb-run --auto-servernum ./gradlew "$GRADLE_TASK" --continue --console=plain --stacktrace 2>&1 | tee "$TEST_LOG"

      - name: Summarize Tests
        if: ${{ always() }}
        env:
          TEST_PLATFORM: ${{ inputs.task }}
          TEST_OUTCOME: ${{ inputs.web && steps.browser-tests.outcome || (runner.os == 'Windows' && steps.windows-tests.outcome || steps.unix-tests.outcome) }}
        run: python .github/scripts/test_report.py collect

      - name: Upload Test Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ inputs.task }}-${{ inputs.runner }}
          path: |
            build/test-report/results-*.json
            build/test-report/gradle-*.log
            ylcs-module/**/build/test-results/**/TEST-*.xml
          if-no-files-found: warn
