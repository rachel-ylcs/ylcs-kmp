name: docs
on:
  push:
    branches:
      - main
    paths:
      - 'ylcs-docs/**'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Check Github Environment
        run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          android: 'true'

      - name: Build Gallery
        run: |
          mkdir -p ylcs-docs/docs/overrides
          ./gradlew ylcs-app:gallery:galleryPublish

      - name: Build ModernScreen
        run: |
          mkdir -p ylcs-docs/docs/overrides
          ./gradlew ylcs-app:modern-screen:modernScreenPublish

      - name: Build Dokka
        run: |
          mkdir -p ylcs-docs/docs/overrides
          ./gradlew dokkaGenerateHtml

      - uses: actions/cache@v6
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: mkdocs-material-

      - name: Pip Install Mkdocs Plugins
        run: |
          pip install mkdocs-material
          pip install mkdocs-glightbox

      - name: Deploy
        run: |
          cd ylcs-docs
          mkdocs gh-deploy --force