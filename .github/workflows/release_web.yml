name: ReleaseWeb
on:
  push:
    tags:
      - 'web*'
concurrency:
  group: workflow-release_web
  cancel-in-progress: true

jobs:
  package-web:
    name: Package Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build

      - name: Build
        run: ./gradlew :ylcs-app:web-app:webArtifact

      - name: Upload JS Application
        uses: actions/upload-artifact@v7
        with:
          name: ylcs-js
          path: outputs/ylcs-js.zip
          archive: false
          if-no-files-found: error

      - name: Upload Wasm Application
        uses: actions/upload-artifact@v7
        with:
          name: ylcs-wasm
          path: outputs/ylcs-wasm.zip
          archive: false
          if-no-files-found: error
