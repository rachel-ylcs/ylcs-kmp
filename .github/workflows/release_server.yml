name: ReleaseServer

on:
  push:
    tags:
      - 'server*'

concurrency:
  group: workflow-release_server
  cancel-in-progress: true

jobs:
  package-server:
    name: Package Server
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build

      - name: Build
        run: ./gradlew ylcs-app:server:serverArtifact

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          path: outputs/server.kexe
          archive: false
          if-no-files-found: error
