name: ReleaseNativeDesktop

on:
  push:
    tags:
      - 'nativeDesktop*'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: workflow-release_native_desktop
  cancel-in-progress: true

jobs:
  package-native-desktop:
    name: Package Native Desktop Artifact
    uses: ./.github/workflows/desktop-build.yml
    with:
      task: :ylcs-app:native-desktop-app:nativeDesktopArtifact
      native: true
      artifact-name: ylcs-native-{0}
      artifact-path: outputs/ylcs-native-{0}.zip
