name: Release

on:
  push:
    tags:
      - 'release*'

concurrency:
  group: workflow-release
  cancel-in-progress: true

jobs:
  package-android:
    name: Package Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          android: 'true'

      - name: Build
        run: ./gradlew ylcs-app:android-app:androidPublish

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ylcs-android
          path: outputs/*Android*.apk
          archive: false
          if-no-files-found: error

  package-ios:
    name: Package iOS
    runs-on: macos-26
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build

      - name: Get Release Version
        id: version
        run: |
          ./gradlew :ylcs-app:app:portal:appGenVersionConfig
          cat ylcs-app/app/portal/build/app-version.properties >> "$GITHUB_OUTPUT"

      - name: Build
        id: package
        uses: ./.github/actions/package-ios
        with:
          ipa-name: "[iOS]银临茶舍${{ steps.version.outputs.version }}.ipa"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ylcs-ios
          path: outputs/*.ipa
          archive: false
          if-no-files-found: error

  package-desktop:
    name: Package JVM Desktop
    uses: ./.github/workflows/desktop-build.yml
    with:
      task: :ylcs-app:desktop-app:desktopPublish
      artifact-name: ylcs-{0}
      artifact-path: outputs/*{1}*.zip

  package-web:
    name: Package Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build

      - name: Build
        run: ./gradlew :ylcs-app:web-app:webJsPublish :ylcs-app:web-app:webPublish

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ylcs-js
          path: outputs/*WebJs*.zip
          archive: false
          if-no-files-found: error

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ylcs-wasm
          path: outputs/*WebWasm*.zip
          archive: false
          if-no-files-found: error

  package-server:
    name: Package Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build

      - name: Build
        run: ./gradlew ylcs-app:server:serverPublish

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ylcs-server
          path: outputs/server.kexe
          archive: false
          if-no-files-found: error

  package-modManager:
    name: Package Mod Manager
    uses: ./.github/workflows/desktop-build.yml
    with:
      task: :ylcs-app:mod-manager:modManagerPublish
      native: true
      submodules: 'false'
      artifact-name: ylcs-mod-manager-{0}
      artifact-path: outputs/*ModManager*.zip

  package-nativeDesktop:
    name: Package Native Desktop
    uses: ./.github/workflows/desktop-build.yml
    with:
      task: :ylcs-app:native-desktop-app:nativeDesktopPublish
      native: true
      artifact-name: ylcs-native-{0}
      artifact-path: outputs/*{1}*.zip

  package-landpage:
    name: Package Landpage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build

      - name: Build
        run: ./gradlew ylcs-app:landpage:landpagePublish

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ylcs-landpage
          path: outputs/landpage.zip
          archive: false

  publish-release:
    name: Publish Release
    needs: [
      package-android,
      package-ios,
      package-desktop,
      package-web,
      package-server,
      package-modManager,
      package-nativeDesktop,
      package-landpage
    ]
    runs-on: ubuntu-latest
    permissions:
      contents: write # 发布 Release 需要写权限
    steps:
      - name: Generate Changelog
        uses: mikepenz/release-changelog-builder-action@v6
        id: changelog
        with:
          mode: "COMMIT"
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}\n\n## 贡献者\n#{{CONTRIBUTORS}}",
              "categories": [
                {
                    "title": "## 新功能",
                    "labels": ["feat", "feature"]
                },
                {
                    "title": "## UI",
                    "labels": ["style", "ui"]
                },
                {
                    "title": "## 修复",
                    "labels": ["fix", "bug"]
                },
                {
                    "title": "## 优化&重构",
                    "labels": ["imporve", "perf", "refactor"]
                },
                {
                    "title": "## 文档",
                    "labels": ["docs", "doc"]
                },
                {
                    "title": "## 杂项",
                    "labels": ["build", "chore", "ci", "update", "revert", "rollback"]
                }
              ],
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs?|feat|feature|fix|bug|imporve|perf|refactor|update|revert|rollback|style|ui){1}(\\([\\w\\-\\.]+\\))?(!)?:(.*)",
                  "on_property": "title",
                  "target": "$1"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: 银临茶舍 ${{ needs.package-ios.outputs.version }} 发布🎉🎉🎉
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          preserve_order: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
