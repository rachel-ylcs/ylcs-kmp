name: Release

on:
  push:
    tags:
      - 'release*'

jobs:
  package-android:
    name: Package Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          android: 'true'

      - name: Build
        run: ./gradlew ylcs-app:android-app:androidArtifact

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ylcs-android
          path: outputs/ylcs-android.apk

  package-ios:
    name: Package iOS
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build

      - name: Build
        id: package
        uses: ./.github/actions/package-ios
        with:
          ipa-name: "ylcs-ios.ipa"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ylcs-ios
          path: ${{ steps.package.outputs.path }}

  package-desktop:
    name: Package JVM Desktop
    uses: ./.github/workflows/release_desktop.yml
    with:
      publish: true

  package-web:
    name: Package Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build

      - name: Build
        run: ./gradlew ylcs-app:web-app:webArtifact

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ylcs-js
          path: outputs/ylcs-js.zip

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ylcs-wasm
          path: outputs/ylcs-wasm.zip

  package-server:
    name: Package Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build

      - name: Build
        run: ./gradlew ylcs-app:server:serverPublish

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ylcs-server
          path: outputs/server.kexe
          if-no-files-found: error

  package-modManager:
    name: Package Mod Manager
    uses: ./.github/workflows/release_mod_manager.yml

  package-nativeDesktop:
    name: Package Native Desktop
    uses: ./.github/workflows/release_native_desktop.yml
    with:
      publish: true

  package-landpage:
    name: Package Landpage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build

      - name: Build
        run: ./gradlew ylcs-app:landpage:landpagePublish

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ylcs-landpage
          path: outputs/landpage.zip

  publish-release:
    name: Publish Release
    needs: [
      package-android,
      package-ios,
      package-desktop,
      package-web,
      package-server,
      package-modManager,
      package-nativeDesktop,
      package-landpage
    ]
    runs-on: ubuntu-latest
    permissions:
      contents: write # 发布 Release 需要写权限
    steps:
      - name: Generate Changelog
        uses: mikepenz/release-changelog-builder-action@v6
        id: changelog
        with:
          mode: "COMMIT"
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}\n\n## 贡献者\n#{{CONTRIBUTORS}}",
              "categories": [
                {
                    "title": "## 新功能",
                    "labels": ["feat", "feature"]
                },
                {
                    "title": "## UI",
                    "labels": ["style", "ui"]
                },
                {
                    "title": "## 修复",
                    "labels": ["fix", "bug"]
                },
                {
                    "title": "## 优化&重构",
                    "labels": ["imporve", "perf", "refactor"]
                },
                {
                    "title": "## 文档",
                    "labels": ["docs", "doc"]
                },
                {
                    "title": "## 杂项",
                    "labels": ["build", "chore", "ci", "update", "revert", "rollback"]
                }
              ],
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs?|feat|feature|fix|bug|imporve|perf|refactor|update|revert|rollback|style|ui){1}(\\([\\w\\-\\.]+\\))?(!)?:(.*)",
                  "on_property": "title",
                  "target": "$1"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: 银临茶舍 ${{ github.ref_name }} 发布🎉🎉🎉
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          preserve_order: true
          files: |
            artifacts/ylcs-android/*
            artifacts/ylcs-ios/*
            artifacts/ylcs-windows/*
            artifacts/ylcs-linux/*
            artifacts/ylcs-macos/*
            artifacts/ylcs-js/*
            artifacts/ylcs-wasm/*
            artifacts/ylcs-server/*
            artifacts/ylcs-mod-manager-windows-x64/*.zip
            artifacts/ylcs-mod-manager-linux-x64/*.zip
            artifacts/ylcs-mod-manager-macos-arm64/*.zip
            artifacts/ylcs-native-windows-x64/*.zip
            artifacts/ylcs-native-linux-x64/*.zip
            artifacts/ylcs-native-macos-arm64/*.zip
            artifacts/ylcs-landpage/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
