name: ReleaseAndroid
on:
  push:
    tags:
      - 'android*'
jobs:
  package-android:
    name: Package Android
    uses: ./.github/workflows/gradle-build.yml
    with:
      runner: ubuntu-latest
      task: ylcs-app:android-app:androidArtifact
      submodules: recursive
      android: true
      artifact-name: ylcs-android
      artifact-path: outputs/ylcs-android.apk
