name: Native Compose Maintenance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native-compose/adaptation/**'
      - 'native-compose/upstream/**'
      - 'native-compose/gradle/**'
      - 'native-compose/verification/**'
      - 'native-compose/build.gradle.kts'
      - 'build-logic/native-bridge/**'
      - 'build-logic/native-binaries/**'
      - 'build-logic/native-dokka/**'
      - 'build-logic/repository-conventions/**'
      - 'build-logic/public-plugin/**'
      - 'build-logic/settings.gradle.kts'
      - 'libs.versions.toml'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.gitattributes'
      - 'gradle/wrapper/**'
      - '.github/workflows/native-compose.yml'
      - '.github/actions/setup-native/**'
      - '.github/actions/setup-gradle-wrapper/**'
  push:
    branches: [main]
    paths:
      - 'native-compose/adaptation/**'
      - 'native-compose/upstream/**'
      - 'native-compose/gradle/**'
      - 'native-compose/verification/**'
      - 'native-compose/build.gradle.kts'
      - 'build-logic/native-bridge/**'
      - 'build-logic/native-binaries/**'
      - 'build-logic/native-dokka/**'
      - 'build-logic/repository-conventions/**'
      - 'build-logic/public-plugin/**'
      - 'build-logic/settings.gradle.kts'
      - 'libs.versions.toml'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.gitattributes'
      - 'gradle/wrapper/**'
      - '.github/workflows/native-compose.yml'
      - '.github/actions/setup-native/**'
      - '.github/actions/setup-gradle-wrapper/**'

permissions:
  contents: read
  pull-requests: read

# Module changes use Build/Test; this workflow verifies the maintained Native stack.
# Maven tasks write local verification files only; no public repository is configured.
concurrency:
  group: native-compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Native Maintenance Inputs
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.direct.outputs.changed || steps.catalog.outputs.catalog-changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            native:
              - 'native-compose/adaptation/**'
              - 'native-compose/upstream/**'
              - 'native-compose/gradle/**'
              - 'native-compose/verification/**'
              - 'native-compose/build.gradle.kts'
              - 'build-logic/native-bridge/**'
              - 'build-logic/native-binaries/**'
              - 'build-logic/native-dokka/**'
              - 'build-logic/repository-conventions/**'
              - 'build-logic/public-plugin/**'
              - 'build-logic/settings.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - '.gitattributes'
              - 'gradle/wrapper/**'
              - '.github/workflows/native-compose.yml'
              - '.github/actions/setup-native/**'
              - '.github/actions/setup-gradle-wrapper/**'
      - name: Require maintenance verification for source or tooling changes
        id: direct
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.native == 'true' }}
        run: echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Prepare Gradle before the Native jobs start
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/setup-gradle-wrapper
        with:
          prepare: 'true'
      - uses: actions/setup-java@v6
        if: ${{ steps.direct.outputs.changed != 'true' }}
        with:
          distribution: oracle
          java-version: '25'
          cache: gradle
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: gradle/actions/wrapper-validation@v6
        if: ${{ steps.direct.outputs.changed != 'true' }}
      - uses: ./.github/actions/setup-gradle-wrapper
        if: ${{ steps.direct.outputs.changed != 'true' }}
      - name: Compare Native dependencies in a catalog-only change
        id: catalog
        if: ${{ steps.direct.outputs.changed != 'true' }}
        env:
          BASE_REFERENCE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p build/native-ci
          arguments=()
          if [[ "$BASE_REFERENCE" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${BASE_REFERENCE}:libs.versions.toml"; then
            git show "${BASE_REFERENCE}:libs.versions.toml" > build/native-ci/base.versions.toml
            arguments+=("-Pnative.ci.baseCatalog=$PWD/build/native-ci/base.versions.toml")
          fi
          bash ./gradlew -p build-logic --no-daemon --build-cache --max-workers=2 --console=plain \
            -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process \
            "${arguments[@]}" :repository-conventions:writeNativeCiInputs
          cat build-logic/repository-conventions/build/native-ci/inputs.properties >> "$GITHUB_OUTPUT"

  build:
    name: Native libraries and SDL host / ${{ matrix.target }}
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: mingw_x64
            gradle-target: windows
            workers: 2
            timeout-minutes: 90
          - runner: ubuntu-24.04
            target: linux_x64
            gradle-target: linux
            workers: 2
            timeout-minutes: 90
          - runner: macos-26
            target: macos_arm64
            gradle-target: macos
            workers: 1
            timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      NATIVE_TARGET: ${{ matrix.target }}
      NATIVE_GRADLE_TARGET: ${{ matrix.gradle-target }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '25'
          cache: gradle
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: gradle/actions/wrapper-validation@v6
      - uses: ./.github/actions/setup-gradle-wrapper
      - name: Configure the Windows Native toolchain
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
          export-path-to-vs: VS_PATH
      - name: Restore and prepare Native sources and SDKs
        id: native-sources
        uses: ./.github/actions/setup-native
        with:
          tools: 'true'
      - name: Source preparation, bridge routing and desktop packaging regressions
        if: runner.os == 'Linux'
        run: |
          bash ./gradlew -p build-logic --no-daemon --build-cache --max-workers=${{ matrix.workers }} --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process \
            :repository-conventions:test :native-bridge:test :public-plugin:test :native-bridge:validatePlugins :public-plugin:validatePlugins
      - name: Native application and packaging regression
        run: |
          bash ./gradlew -p build-logic --no-daemon --build-cache --max-workers=${{ matrix.workers }} --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process \
            :native-bridge:hostTest
      - name: Test and publish all owned host libraries
        run: |
          mkdir -p build/native-ci
          bash ./gradlew --no-daemon --build-cache --profile --max-workers=${{ matrix.workers }} --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process \
            -Pkotlin.build.report.output=file \
            :native-compose:testHost :native-compose:publishHost 2>&1 | tee build/native-ci/host-libraries.log
      - name: Require real Native behavior and complete publications
        run: |
          bash ./gradlew -p build-logic --no-daemon --build-cache --max-workers=${{ matrix.workers }} --stacktrace \
            :native-bridge:verifyNativeHost
      - name: Consume the published KLIBs without source substitutions
        timeout-minutes: 15
        run: |
          bash ./gradlew -p build-logic --no-daemon --build-cache --max-workers=${{ matrix.workers }} --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process \
            :native-bridge:publishAllPublicationsToLocalVerificationRepository
          bash ./gradlew -p native-compose/verification/compose-ui-consumer --no-daemon --build-cache --max-workers=${{ matrix.workers }} --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process \
            "${NATIVE_GRADLE_TARGET}Test" verifyNativeMavenClosure
          bash ./gradlew -p native-compose/verification/compose-ui-consumer --no-daemon --build-cache --max-workers=${{ matrix.workers }} --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process -Pnative.explicit=true \
            verifyNativeMavenClosure
      - name: Publish a framework library and consume its JVM and Native variants
        run: |
          bash ./gradlew -p native-compose/verification/framework-producer --no-daemon --build-cache --max-workers=${{ matrix.workers }} --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process publishHost
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            bash ./gradlew -p native-compose/verification/framework-consumer --no-daemon --build-cache --max-workers=${{ matrix.workers }} --stacktrace \
              -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process \
              desktopTest verifyFrameworkResolution
          fi
          bash ./gradlew -p native-compose/verification/framework-consumer --no-daemon --build-cache --max-workers=${{ matrix.workers }} --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process -Pframework.native=true \
            "${NATIVE_GRADLE_TARGET}Test" verifyFrameworkResolution
      - uses: actions/upload-artifact@v7
        with:
          name: native-compose-maven-${{ matrix.target }}
          path: ${{ steps.native-sources.outputs.generation }}/build/repository/
          if-no-files-found: error
      - name: Diagnose a macOS toolchain failure
        if: failure() && runner.os == 'macOS'
        timeout-minutes: 2
        run: |
          /usr/bin/xcode-select --print-path
          /usr/bin/xcodebuild -version
          /usr/bin/xcrun --log --find ld
          /usr/bin/xcrun --sdk macosx --show-sdk-path
          /usr/sbin/sysctl hw.memsize vm.swapusage
          /usr/bin/memory_pressure -Q
          df -h
      - name: Library and bridge test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-compose-evidence-${{ matrix.target }}
          path: |
            ${{ steps.native-sources.outputs.generation }}/build/compose-ui/*/test-results/
            ${{ steps.native-sources.outputs.generation }}/build/compose-ui/*/reports/tests/
            ${{ steps.native-sources.outputs.generation }}/build/framework-consumer-*/test-results/
            ${{ steps.native-sources.outputs.generation }}/build/framework-consumer-*/reports/tests/
            ${{ steps.native-sources.outputs.generation }}/build/repository/**/*.module
            ${{ steps.native-sources.outputs.generation }}/build/repository/**/*.pom
            ${{ steps.native-sources.outputs.generation }}/skiko/workspace/skiko/build/test-results/
            ${{ steps.native-sources.outputs.generation }}/skiko/workspace/skiko/skiko-skottie/build/test-results/
            build-logic/native-bridge/build/test-results/
            build-logic/native-bridge/build/reports/tests/
            build-logic/public-plugin/build/test-results/
            build-logic/repository-conventions/build/test-results/
            build/native-ci/
            build/reports/profile/
            ${{ steps.native-sources.outputs.generation }}/build/compose-ui/*/reports/kotlin-build/
            ${{ steps.native-sources.outputs.generation }}/build/compose-ui/root/reports/profile/
            ${{ steps.native-sources.outputs.generation }}/skiko/workspace/skiko/build/reports/kotlin-build/
            ${{ steps.native-sources.outputs.generation }}/skiko/workspace/skiko/skiko-skottie/build/reports/kotlin-build/
            ${{ steps.native-sources.outputs.generation }}/skiko/workspace/skiko/build/reports/profile/
          if-no-files-found: warn

  assemble:
    name: Assemble the three-target local Maven verification repository
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '25'
          cache: gradle
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: gradle/actions/wrapper-validation@v6
      - uses: ./.github/actions/setup-gradle-wrapper
      - uses: actions/download-artifact@v8
        with:
          pattern: native-compose-maven-*
          path: host-publications
      - name: Require all host artifacts and one canonical KMP root
        id: assemble
        run: |
          bash ./gradlew -p build-logic --no-daemon --build-cache --max-workers=2 --stacktrace \
            :native-bridge:assembleNativeRepository
          printf 'generation=native-compose/%s\n' "$(jq -er '.directory' native-compose/vendor/current.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: native-compose-maven
          path: ${{ steps.assemble.outputs.generation }}/build/assembled-repository/
          if-no-files-found: error
