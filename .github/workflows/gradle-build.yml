name: Gradle Build

on:
  workflow_call:
    inputs:
      runner:
        description: Runner used to execute the Gradle task.
        type: string
        default: ubuntu-latest
      task:
        description: A single fully qualified Gradle task.
        type: string
        required: true
      submodules:
        description: Whether to fetch submodules; accepts false, true, or recursive.
        type: string
        default: 'false'
      android:
        description: Install Android SDK packages.
        type: boolean
        default: false
      msvc:
        description: Configure the MSVC toolchain on Windows.
        type: boolean
        default: false
      gtk:
        description: Install GTK development dependencies on Linux.
        type: boolean
        default: false
      virtual-display:
        description: Run the Gradle task with Xvfb and software rendering on Linux.
        type: boolean
        default: false

jobs:
  build:
    name: Gradle
    runs-on: ${{ inputs.runner }}
    # Shell configuration cannot use runner.os; choose it from the runner label.
    defaults:
      run:
        shell: ${{ startsWith(inputs.runner, 'windows-') && 'pwsh' || 'bash' }}
    steps:
      - name: Setup Build Environment
        uses: $/.github/actions/setup-build
        with:
          submodules: ${{ inputs.submodules }}
          android: ${{ inputs.android }}
          msvc: ${{ inputs.msvc }}
          gtk: ${{ inputs.gtk }}
          virtual-display: ${{ inputs.virtual-display }}

      - name: Build
        if: ${{ runner.os != 'Linux' || !inputs.virtual-display }}
        env:
          GRADLE_TASK: ${{ inputs.task }}
        run: ./gradlew "${{ runner.os == 'Windows' && '$env:GRADLE_TASK' || '$GRADLE_TASK' }}"

      - name: Build with Virtual Display
        if: ${{ runner.os == 'Linux' && inputs.virtual-display }}
        shell: bash
        env:
          GRADLE_TASK: ${{ inputs.task }}
          SKIKO_RENDER_API: SOFTWARE_FAST
        # AOT training launches the desktop app and needs an X11 display.
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" ./gradlew "$GRADLE_TASK"
