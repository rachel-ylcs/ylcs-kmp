name: Repository Statistics

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'ylcs-app/**'
      - 'ylcs-module/**'
      - 'build-logic/**'
      - 'ylcs-docs/**'
      - 'native-compose/adaptation/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - '.gitattributes'
      - '.gitmodules'
      - '.gitignore'
      - 'settings.gradle.kts'
      - 'libs.versions.toml'
      - 'gradle.properties'
  pull_request:
    branches:
      - main
    paths:
      - 'README.md'
      - 'ylcs-app/**'
      - 'ylcs-module/**'
      - 'build-logic/**'
      - 'ylcs-docs/**'
      - 'native-compose/adaptation/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - '.gitattributes'
      - '.gitmodules'
      - '.gitignore'
      - 'settings.gradle.kts'
      - 'libs.versions.toml'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-statistics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  statistics:
    name: Generate repository reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Generate Markdown, JSON and HTML reports
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/repository_statistics.py \
            --output-dir build/statistic \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: repository-statistics
          path: build/statistic/
          if-no-files-found: error
          retention-days: 30

  readme-card:
    name: Render README status card
    needs: statistics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Download repository reports
        uses: actions/download-artifact@v8
        with:
          name: repository-statistics
          path: build/statistic

      - name: Install Playwright and fonts
        run: |
          python -m pip install playwright==1.65.2 Pillow==13.0.0
          python -m playwright install --with-deps --only-shell chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Render the status card
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/render_readme_status.py \
            --stats build/statistic/statistic.json \
            --output build/readme-status/repository-status.webp

      - name: Upload the status card
        uses: actions/upload-artifact@v7
        with:
          name: readme-status
          path: build/readme-status/repository-status.webp
          if-no-files-found: error
          compression-level: 0

  publish-readme-card:
    name: Publish README status card
    needs: readme-card
    if: github.repository == 'rachel-ylcs/ylcs-kmp' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download the status card
        uses: actions/download-artifact@v8
        with:
          name: readme-status
          path: build/readme-status

      - name: Update readme-assets
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash .github/scripts/publish_readme_status.sh build/readme-status/repository-status.webp "$GITHUB_SHA"
