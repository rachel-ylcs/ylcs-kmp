name: Native Compose UI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native-compose/**'
      - 'build-logic/native-bridge/**'
      - 'build-logic/repository-conventions/**'
      - 'build-logic/public-plugin/**'
      - 'build-logic/settings.gradle.kts'
      - 'ylcs-app/native-compose/**'
      - 'libs.versions.toml'
      - 'settings.gradle.kts'
      - 'gradle/wrapper/**'
      - '.github/workflows/native-core.yml'
  push:
    branches: [main]
    paths:
      - 'native-compose/**'
      - 'build-logic/native-bridge/**'
      - 'build-logic/repository-conventions/**'
      - 'build-logic/public-plugin/**'
      - 'build-logic/settings.gradle.kts'
      - 'ylcs-app/native-compose/**'
      - 'libs.versions.toml'
      - 'settings.gradle.kts'
      - 'gradle/wrapper/**'
      - '.github/workflows/native-core.yml'

permissions:
  contents: read

# This one Native workflow advances with the current porting stage.
# Maven tasks write local verification files only; no public repository is configured.
concurrency:
  group: native-compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compose UI and SDL host / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: mingw_x64
            test-task: windowsTest
            preview-task: runWindowsDebugExecutable
            skiko-publication: MingwX64
          - runner: ubuntu-24.04
            target: linux_x64
            test-task: linuxTest
            preview-task: runLinuxDebugExecutable
            skiko-publication: LinuxX64
          - runner: macos-26
            target: macos_arm64
            test-task: macosTest
            preview-task: runMacosDebugExecutable
            skiko-publication: MacosArm64
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      NATIVE_TARGET: ${{ matrix.target }}
      NATIVE_TEST_TASK: ${{ matrix.test-task }}
      SKIKO_PUBLICATION: ${{ matrix.skiko-publication }}
      NATIVE_PREVIEW_TASK: ${{ matrix.preview-task }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '25'
          cache: gradle
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Configure the Windows Native toolchain
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
          export-path-to-vs: VS_PATH
      - name: Linux Native build and link dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxss-dev libxtst-dev libwayland-dev wayland-protocols libxkbcommon-dev
      - name: Source and publication tool regressions
        run: python -m unittest discover -s native-compose/scripts/tests -p 'test_*.py' -v
      - name: Prepare the pinned Skiko and Compose source checkouts
        run: |
          python native-compose/scripts/sync_upstream.py
          python native-compose/scripts/sync_compose.py
      - name: Bridge routing regressions and local plugin Maven files
        run: |
          bash ./gradlew -p build-logic --no-daemon --max-workers=2 --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process \
            :native-bridge:test :native-bridge:validatePlugins \
            :native-bridge:publishAllPublicationsToLocalVerificationRepository
      - name: Publish the host Skiko foundation into local Maven files
        run: |
          bash ./gradlew -p native-compose/vendor/skiko/workspace/skiko \
            --no-daemon --max-workers=2 --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process \
            publishKotlinMultiplatformPublicationToBuildRepoRepository \
            "publish${SKIKO_PUBLICATION}PublicationToBuildRepoRepository"
      - name: Native UI library tests and host Maven files
        run: |
          bash ./gradlew -p native-compose/vendor/compose/workspace/native-desktop \
            --no-daemon --max-workers=2 --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process -Pnative.ui.ci=true \
            ":ui-util:${NATIVE_TEST_TASK}" ":ui-geometry:${NATIVE_TEST_TASK}" ":ui-unit:${NATIVE_TEST_TASK}" \
            ":ui-graphics:${NATIVE_TEST_TASK}" ":ui-text:${NATIVE_TEST_TASK}" ":ui-skiko:${NATIVE_TEST_TASK}" \
            ":ui-backhandler:${NATIVE_TEST_TASK}" ":ui:${NATIVE_TEST_TASK}" \
            publishHostToVerificationRepository
          python - <<'PY'
          import shutil
          from pathlib import Path
          group = Path('love/yinlin/native/skiko')
          shutil.copytree(Path('native-compose/vendor/skiko/workspace/skiko/build/repo') / group,
                          Path('native-compose/vendor/build/compose-ui/repository') / group)
          PY
      - name: Require real Native behavior and complete publications
        run: |
          python native-compose/scripts/verify_compose_ui.py --target "$NATIVE_TARGET" \
            --tests native-compose/vendor/build/compose-ui
          printf 'Compose UI %s: 72 regressions covering scenes, input, dispatch, back handlers and the UI foundations passed.\n' \
            "$NATIVE_TARGET" >> "$GITHUB_STEP_SUMMARY"
      - name: Compile, link and smoke-test the current Composable application preview
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          bash ./gradlew --no-daemon --max-workers=2 --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process -Pnative.compose=true \
            -Pnative.renderer=software -Pnative.smoke=true \
            ":ylcs-app:native-compose:${NATIVE_PREVIEW_TASK}"
      - uses: actions/upload-artifact@v7
        with:
          name: native-compose-ui-maven-${{ matrix.target }}
          path: native-compose/vendor/build/compose-ui/repository/
          if-no-files-found: error
      - name: Upload bridge Maven verification files
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: native-bridge-maven
          path: build-logic/build/native-bridge-repository/
          if-no-files-found: error
      - name: Library and bridge test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-compose-ui-evidence-${{ matrix.target }}
          path: |
            native-compose/vendor/build/compose-ui/*/test-results/
            native-compose/vendor/build/compose-ui/*/reports/tests/
            native-compose/vendor/build/compose-ui/repository/**/*.module
            native-compose/vendor/build/compose-ui/repository/**/*.pom
            native-compose/vendor/skiko/workspace/skiko/build/repo/**/*.module
            native-compose/vendor/skiko/workspace/skiko/build/repo/**/*.pom
            build-logic/native-bridge/build/test-results/
            build-logic/native-bridge/build/reports/tests/
          if-no-files-found: warn

  assemble:
    name: Assemble the three-target local Maven verification repository
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: native-compose-ui-maven-*
          path: host-publications
      - name: Require all host artifacts and one canonical KMP root
        run: |
          python native-compose/scripts/verify_compose_ui.py \
            --input mingw_x64=host-publications/native-compose-ui-maven-mingw_x64 \
            --input linux_x64=host-publications/native-compose-ui-maven-linux_x64 \
            --input macos_arm64=host-publications/native-compose-ui-maven-macos_arm64 \
            --output native-compose/vendor/build/compose-ui/assembled-repository
      - uses: actions/upload-artifact@v7
        with:
          name: native-compose-ui-maven
          path: native-compose/vendor/build/compose-ui/assembled-repository/
          if-no-files-found: error

  consume:
    name: UI Maven consumer / ${{ matrix.target }}
    needs: assemble
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: mingw_x64
            test-task: windowsTest
          - runner: ubuntu-24.04
            target: linux_x64
            test-task: linuxTest
          - runner: macos-26
            target: macos_arm64
            test-task: macosTest
    defaults:
      run:
        shell: bash
    env:
      NATIVE_TEST_TASK: ${{ matrix.test-task }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '25'
          cache: gradle
      - name: Linux Native link dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxss-dev libxtst-dev libwayland-dev wayland-protocols libxkbcommon-dev
      - name: Configure the Windows Native linker environment
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
          export-path-to-vs: VS_PATH
      - uses: actions/download-artifact@v8
        with:
          name: native-compose-ui-maven
          path: maven-ui
      - uses: actions/download-artifact@v8
        with:
          name: native-bridge-maven
          path: maven-plugins
      - name: Test common official requests and explicit Native Maven requests
        run: |
          test ! -e native-compose/vendor/compose/state.json
          test ! -e native-compose/vendor/skiko/state.json
          repositoryRoot="$PWD"
          if [[ "$RUNNER_OS" == Windows ]]; then
            repositoryRoot="$(pwd -W)"
          fi
          for explicit in false true; do
            bash ./gradlew -p native-compose/verification/compose-ui-consumer \
              --no-daemon --max-workers=2 --stacktrace --rerun-tasks \
              -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process \
              "-Pnative.repository=$repositoryRoot/maven-ui" "-Pnative.plugin.repository=$repositoryRoot/maven-plugins" \
              "-Pnative.explicit=$explicit" verifyNativeMavenClosure "$NATIVE_TEST_TASK"
          done
          test ! -e native-compose/vendor/compose/state.json
          test ! -e native-compose/vendor/skiko/state.json
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('native-compose/vendor/build/compose-ui/maven-consumer/test-results').glob('**/TEST-*.xml'))
          assert reports, 'No independent Maven consumer test reports'
          suites = [ET.parse(path).getroot() for path in reports]
          assert any('ComposeUiPublicationTest' in suite.attrib['name'] and int(suite.attrib['tests']) == 4 for suite in suites)
          assert any('ComposeScenePublicationTest' in suite.attrib['name'] and int(suite.attrib['tests']) == 2 for suite in suites)
          assert all(int(suite.attrib.get(key, 0)) == 0 for suite in suites for key in ['failures', 'errors', 'skipped'])
          PY
      - name: Independent Maven consumer test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-compose-ui-consumer-${{ matrix.target }}
          path: |
            native-compose/vendor/build/compose-ui/maven-consumer/test-results/
            native-compose/vendor/build/compose-ui/maven-consumer/reports/tests/
          if-no-files-found: warn
