name: Setup Build Environment
description: Prepare the shared JDK and optional platform build tools after the caller checks out the repository.

inputs:
  android:
    description: Install Android SDK packages.
    default: 'false'
  msvc:
    description: Configure the MSVC toolchain on Windows.
    default: 'false'
  gtk:
    description: Install GTK development dependencies on Linux.
    default: 'false'
  virtual-display:
    description: Install Xvfb and Xauthority tools on Linux.
    default: 'false'
  native-tools:
    description: Install desktop Native development tools and restore compiled SDL and Skia SDKs.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Dependencies (Linux)
      if: ${{ runner.os == 'Linux' && (inputs.gtk == 'true' || inputs.virtual-display == 'true') }}
      shell: bash
      env:
        INSTALL_GTK: ${{ inputs.gtk }}
        INSTALL_VIRTUAL_DISPLAY: ${{ inputs.virtual-display }}
      run: |
        packages=()
        if [[ "$INSTALL_GTK" == 'true' ]]; then
          packages+=(libgtk-3-dev)
        fi
        if [[ "$INSTALL_VIRTUAL_DISPLAY" == 'true' ]]; then
          packages+=(xvfb xauth)
        fi
        sudo apt-get update
        sudo apt-get install -y "${packages[@]}"

    - name: Setup JDK
      uses: actions/setup-java@v6
      with:
        distribution: oracle
        java-version: '25'

    - name: Cache Gradle Dependencies and Build Outputs
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Setup Android SDK
      if: ${{ inputs.android == 'true' }}
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-37.2'

    - name: Setup MSVC
      if: ${{ inputs.msvc == 'true' && runner.os == 'Windows' }}
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64
        export-path-to-vs: VS_PATH

    - name: Restore Native Compose Dependencies
      uses: ./.github/actions/setup-native
      with:
        tools: ${{ inputs.native-tools }}
