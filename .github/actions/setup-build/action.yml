name: Setup Build Environment
description: Prepare the shared JDK and optional platform build tools.

inputs:
  checkout:
    description: Check out the repository before preparing build tools.
    default: 'true'
  fetch-depth:
    description: Number of commits to fetch when checkout is enabled.
    default: '1'
  submodules:
    description: Whether to fetch submodules; accepts false, true, or recursive.
    default: 'false'
  android:
    description: Install Android SDK packages.
    default: 'false'
  msvc:
    description: Configure the MSVC toolchain on Windows.
    default: 'false'
  gtk:
    description: Install GTK development dependencies on Linux.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Checkout Code
      if: ${{ inputs.checkout == 'true' }}
      uses: $/.github/actions/checkout
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        submodules: ${{ inputs.submodules }}

    - name: Install Dependencies (Linux)
      if: ${{ inputs.gtk == 'true' && runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev

    - name: Setup JDK
      uses: actions/setup-java@v6
      with:
        distribution: oracle
        java-version: '25'
        cache: gradle
        cache-dependency-path: |
          ./*.gradle*
          ./**/gradle-wrapper.properties

    - name: Setup Android SDK
      if: ${{ inputs.android == 'true' }}
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-37.1'

    - name: Setup MSVC
      if: ${{ inputs.msvc == 'true' && runner.os == 'Windows' }}
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64
        export-path-to-vs: VS_PATH
