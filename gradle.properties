#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8G --enable-native-access=ALL-UNNAMED
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.incremental.jvm.fir=true

#Gradle
org.gradle.jvmargs=-Xmx16G -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.caching=true
org.gradle.parallel=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#iOS
compose.ios.resources.sync=true
