# Gradle
org.gradle.jvmargs=-Xms2G -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xms1G --enable-native-access=ALL-UNNAMED
kotlin.incremental.native=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.native.jvmArgs=--enable-native-access=ALL-UNNAMED
kotlin.native.ignoreDisabledTargets=true
kotlin.suppressGradlePluginWarnings=CrossCompilationWithCinterops

# Rachel
rachel.kotlin.compilerArgs=-Xexpect-actual-classes,-Xcollection-literals

# Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# iOS
compose.ios.resources.sync=true
