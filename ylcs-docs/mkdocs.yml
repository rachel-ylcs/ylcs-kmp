site_name: Rachel 开发向导
site_url: https://rachel-ylcs.github.io/ylcs-kmp/
site_author: 银临茶舍项目组
site_description: 以 Kotlin Multiplatform 与 Compose Multiplatform 构建全平台应用的 Rachel 框架官方指南。
copyright: 银临茶舍 · Rachel 框架文档

repo_url: https://github.com/rachel-ylcs/ylcs-kmp
repo_name: ylcs-kmp

theme:
    name: material
    custom_dir: theme
    language: zh
    logo: assets/logo.svg
    favicon: assets/favicon.svg
    font: false
    icon:
        repo: fontawesome/brands/github
    palette:
        - scheme: rachel-dark
          primary: custom
          accent: custom
          toggle:
              icon: material/weather-night
              name: 切换到浅色模式
        - scheme: rachel-light
          primary: custom
          accent: custom
          toggle:
              icon: material/weather-sunny
              name: 切换到深色模式
    features:
        - navigation.tracking
        - navigation.tabs
        - navigation.sections
        - navigation.top
        - navigation.footer
        - search.suggest
        - search.highlight
        - search.share
        - content.code.copy
        - content.code.annotate
        - content.tooltips
        - toc.follow

hooks:
    - hooks.py

plugins:
    - search:
          lang:
              - zh
              - en
          separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
    - statistics:
          page_template: _partials/page_statistics.html
          words_per_minute: 300
          codelines_per_minute: 80

markdown_extensions:
    - abbr
    - admonition
    - attr_list
    - def_list
    - footnotes
    - md_in_html
    - tables
    - toc:
          permalink: "¶"
          toc_depth: 3
    - pymdownx.betterem
    - pymdownx.caret
    - pymdownx.details
    - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - pymdownx.highlight:
          anchor_linenums: true
          auto_title: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.keys
    - pymdownx.mark
    - pymdownx.smartsymbols
    - pymdownx.snippets
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: rc-mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.tasklist:
          custom_checkbox: true
    - pymdownx.tilde

extra_css:
    - assets/stylesheets/rachel.css

extra_javascript:
    - assets/javascripts/rachel.js

extra:
    generator: false
    site_kind: docs
    site_short: Rachel
    switch_url: https://yinlin.love/
    switch_label: 银临茶舍 APP
    switch_short: 茶舍
    switch_mark: 茶
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/rachel-ylcs/ylcs-kmp
          name: GitHub
        - icon: fontawesome/brands/qq
          link: https://qm.qq.com/cgi-bin/qm/qr?k=0tJOqsYAaonMEq6dFqmg8Zb0cfXYzk8E&authKey=%2BchwTB02SMM8pDjJVgLN4hZysG0%2BXRWT4GAIGs6RqGazJ2NCqdkYETWvtTPrd69R
          name: QQ 群

validation:
    nav:
        omitted_files: info
    links:
        not_found: warn
        absolute_links: info
