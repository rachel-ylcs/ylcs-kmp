{% extends "main.html" %}

{% block content %}
  {% if config.extra.site_kind == "landing" %}
    <div class="rc-404 rc-404--landing">
      <div class="rc-404__code">404</div>
      <h1 style="margin-top:1rem">这一页已经散入茶烟</h1>
      <p class="rc-lead" style="margin:0 auto 1.5rem">你访问的地址不存在或已经迁移。可以回到银临茶舍首页，也可以查阅使用指南继续了解应用。</p>
      <div class="rc-hero__actions" style="justify-content:center">
        <a class="rc-btn rc-btn--primary" href="{{ nav.homepage.url | url }}"><span>回到银临茶舍</span><span>→</span></a>
        <a class="rc-btn" href="{{ 'guide/' | url }}"><span>使用指南</span><span>↗</span></a>
      </div>
    </div>
  {% else %}
    <div class="rc-404">
      <div class="rc-404__code">404</div>
      <h1 style="margin-top:1rem">这条路径没有对应的页面</h1>
      <p class="rc-lead" style="margin:0 auto 1.5rem">链接可能已更新，或页面尚未生成。可以从首页重新选择阅读路径，或使用搜索查找关键词。</p>
      <div class="rc-hero__actions" style="justify-content:center">
        <a class="rc-btn rc-btn--primary" href="{{ nav.homepage.url | url }}"><span>返回首页</span><span>→</span></a>
        <a class="rc-btn" href="{{ 'start/' | url }}"><span>快速开始</span><span>↗</span></a>
      </div>
    </div>
  {% endif %}
{% endblock %}
